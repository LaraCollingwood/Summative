cluster-cancel: scancel %j
cluster:
  sbatch
    --partition={resources.slurm_partition}
    --account={resources.slurm_account}
    --nodes={resources.nodes}
    --time={resources.time}
    --mem={resources.mem_mb}
    --ntasks-per-node={resources.ntasks}
    --output ./logs/slurm_logs/%j.out
default-resources:
  - slurm_partition=teach_cpu
  - slurm_account=SSCM040064
  - mem_mb=1000
  - time=60
  - ntasks=1
  - nodes=1
resources:
  - download_slots=3
jobs: 9
printshellcmds: True
scheduler: greedy
use-conda: True
restart-times: 0
max-jobs-per-second: 10
max-status-checks-per-second: 1
local-cores: 1
latency-wait: 10
keep-going: True
rerun-incomplete: True
printshellcmds: True